<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="game-container">
        <div>
            <h1>Memory Game</h1>
            <p>Vind alle gelijke kaarten.</p>
        </div>

        <section class="game-info">
            <p>Zetten: <span id="moves">0</span></p>
            <p> Tijd: <span id="timer">0</span></p>
        </section>

        <section class="game-board" id="game-board">
            <!-- De kaarten worden later met JavaScript toegevoegd. -->
        </section>

        <button id="restart-button">
            Opnieuw starten
        </button>

    </main>

    <div id="win-popup" class="popup hidden">
        <div class="popup-content">
            <button id="close-popup" class="close-popup" type="button">
                ×
            </button>

            <div class="popup-icon">🏆</div>

            <h2>Proficiat!</h2>

            <p>Je hebt alle kaartparen gevonden.</p>

            <div class="popup-results">
                <p>
                    Zetten:
                    <strong id="final-moves">0</strong>
                </p>

                <p>
                    Tijd:
                    <strong id="final-time">0 seconden</strong>
                </p>
            </div>

            <button id="play-again-button" class="play-again-button" type="button">
                Opnieuw spelen
            </button>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
